on:
  push:
    branches: [main, master]
  pull_request:

name: Container

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check container scripts
        run: |
          bash -n docker/entrypoint.sh docker/healthcheck.sh
          shellcheck docker/entrypoint.sh docker/healthcheck.sh

      - name: Check local composition
        env:
          ANTHROPIC_API_KEY: test-anthropic
          AZURE_OPENAI_API_KEY: test-azure
          GEMINI_API_KEY: test-gemini
          OAUTH2_PROXY_CLIENT_ID: test-client
          OAUTH2_PROXY_CLIENT_SECRET: test-secret
          OAUTH2_PROXY_COOKIE_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          OAUTH2_PROXY_OIDC_ISSUER_URL: https://example.auth0.com/
          RILL_POSTGRES_PASSWORD: test-password
        run: |
          docker compose --profile poll config --format json | jq --exit-status '
            .services.web.image == .services.poll.image and
            .services.web.command == ["web"] and
            .services.poll.command == ["poll"] and
            .services.web.ports[0].host_ip == "127.0.0.1" and
            (.services.database.ports == null) and
            .services.web.environment.OTEL_R_SUPPRESS_SCOPES == "httr2" and
            .services.poll.environment.OTEL_R_SUPPRESS_SCOPES == "httr2" and
            .services.web.environment.OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT == "false" and
            .services.web.environment.ANTHROPIC_API_KEY == "test-anthropic" and
            .services.web.environment.AZURE_OPENAI_API_KEY == "test-azure" and
            .services.web.environment.GEMINI_API_KEY == "test-gemini" and
            (.services.poll.environment.ANTHROPIC_API_KEY == null)
          '

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build production image
        id: build
        uses: docker/build-push-action@v6
        with:
          build-args: RILL_SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Verify installed image
        if: github.event_name == 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          image="$IMAGE_NAME:sha-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          docker run --rm --entrypoint Rscript "$image" \
            --vanilla -e 'stopifnot(
              packageVersion("rill") == "0.0.0.9000",
              requireNamespace("otel", quietly = TRUE),
              requireNamespace("otelsdk", quietly = TRUE)
            )'
          test "$(docker run --rm --entrypoint sh "$image" \
            -c 'printf %s "$OTEL_R_SUPPRESS_SCOPES"')" = "httr2"
          test "$(docker run --rm --entrypoint sh "$image" \
            -c 'printf %s "$OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT"')" = "false"
          docker run --rm --entrypoint oauth2-proxy "$image" --version | \
            grep --fixed-strings 'v7.15.4'
          set +e
          docker run --rm "$image" unknown
          status=$?
          set -e
          test "$status" -eq 64
          set +e
          output="$(docker run --rm "$image" poll 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep --fixed-strings \
            "Can't poll feeds without a durable store." <<< "$output"

      - name: Smoke test proxied web role
        if: github.event_name == 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          cleanup() {
            docker rm --force rill-web-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name rill-web-smoke \
            --publish 127.0.0.1:10000:10000 \
            --env OAUTH2_PROXY_CLIENT_ID=test-client \
            --env OAUTH2_PROXY_CLIENT_SECRET=test-secret \
            --env OAUTH2_PROXY_COOKIE_SECRET=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            --env OAUTH2_PROXY_COOKIE_SECURE=false \
            --env OAUTH2_PROXY_OIDC_ISSUER_URL=https://accounts.google.com \
            --env OAUTH2_PROXY_REDIRECT_URL=http://127.0.0.1:10000/oauth2/callback \
            --env OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true \
            --env RILL_CAPTURE_TOKEN=test-secret \
            "$IMAGE_NAME:sha-${GITHUB_SHA}" web

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:10000/ready >/dev/null; then
              ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' rill-web-smoke)" != "true" ]]; then
              docker logs rill-web-smoke
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            docker logs rill-web-smoke
            exit 1
          fi

          docker exec rill-web-smoke \
            curl --fail --silent http://127.0.0.1:3838/ >/dev/null
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:10000/)"
          test "$status" = "302"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS \
            http://127.0.0.1:10000/api/v1/captures)"
          test "$status" = "204"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Authorization: Bearer test-secret' \
            http://127.0.0.1:10000/api/v1/captures)"
          test "$status" = "415"

      - name: Record production digest
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          printf 'Published image: %s@%s\n' \
            "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
