name: rill

x-rill-image: &rill-image
  image: rill:local
  build:
    context: .
    args:
      RILL_SOURCE_REVISION: local

x-rill-environment: &rill-environment
  DATABASE_URL: postgresql://rill:${RILL_POSTGRES_PASSWORD:?Set RILL_POSTGRES_PASSWORD}@database:5432/rill
  RILL_ACTOR_ID: ${RILL_ACTOR_ID:-local-reader}
  RILL_ENV: ${RILL_ENV:-development}
  RILL_AGENT_MODEL: ${RILL_AGENT_MODEL:-openai}
  RILL_AGENT_BASE_URL: ${RILL_AGENT_BASE_URL:-}
  RILL_AGENT_POLICY_URL: ${RILL_AGENT_POLICY_URL:-}
  RILL_ORIENTATION_ENABLED: ${RILL_ORIENTATION_ENABLED:-false}
  RILL_CAPTURE_TOKEN: ${RILL_CAPTURE_TOKEN:-}
  DEFUDDLE_BACKEND: ${DEFUDDLE_BACKEND:-hosted}
  DEFUDDLE_API_KEY: ${DEFUDDLE_API_KEY:-}
  OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: ${OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT:-256}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-false}
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-http}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=personal-reader,deployment.environment=development}
  OTEL_R_SUPPRESS_SCOPES: ${OTEL_R_SUPPRESS_SCOPES:-httr2}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-rill}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-http}

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rill
      POSTGRES_PASSWORD: ${RILL_POSTGRES_PASSWORD:?Set RILL_POSTGRES_PASSWORD}
      POSTGRES_USER: rill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username rill --dbname rill"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rill-postgres:/var/lib/postgresql/data

  web:
    <<: *rill-image
    command: ["web"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *rill-environment
      PORT: ${RILL_PUBLIC_PORT:-10000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      DATABRICKS_CLIENT_ID: ${DATABRICKS_CLIENT_ID:-}
      DATABRICKS_CLIENT_SECRET: ${DATABRICKS_CLIENT_SECRET:-}
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PORTKEY_API_KEY: ${PORTKEY_API_KEY:-}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_TOKEN: ${SNOWFLAKE_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?Set OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?Set OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?Set OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:?Set OAUTH2_PROXY_OIDC_ISSUER_URL}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL:-http://127.0.0.1:10000/oauth2/callback}
      OAUTH2_PROXY_SCOPE: "openid profile email"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      RILL_ALLOWED_OIDC_SUBJECTS: ${RILL_ALLOWED_OIDC_SUBJECTS:?Set RILL_ALLOWED_OIDC_SUBJECTS}
    ports:
      - "127.0.0.1:${RILL_PUBLIC_PORT:-10000}:${RILL_PUBLIC_PORT:-10000}"

  poll:
    <<: *rill-image
    profiles: ["poll"]
    command: ["poll"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *rill-environment
    healthcheck:
      disable: true

volumes:
  rill-postgres:
