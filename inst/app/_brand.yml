meta:
  name: Rill

logo:
  images:
    otter-mark:
      path: www/rill-otter-mark.png
      alt: Rill otter reading a book
    otter-reading:
      path: www/rill-otter-reading.png
      alt: Rill otter reading a book
  small: otter-mark
  medium: otter-reading

color:
  palette:
    river-mist: "#DEECEB"
    reed: "#2F746D"
    reed-deep: "#124C50"
    paper: "#FFFDF7"
    sand: "#F4EEDC"
    ink: "#243936"
    ochre: "#C08A32"
    night: "#0E0F0D"
    night-queue: "#11130F"
    night-sidebar: "#151D14"
    parchment: "#E6D7C3"
    celadon: "#9EAF87"
    moon-ochre: "#E1A23A"
  foreground: ink
  background: paper
  primary: reed
  secondary: ochre

typography:
  fonts:
    - family: Atkinson Hyperlegible
      source: google
      weight: [400, 700]
      style: [normal, italic]
      display: swap
    - family: Literata
      source: google
      weight: [400, 500, 600]
      style: [normal, italic]
      display: swap
  base:
    family: Atkinson Hyperlegible
    size: 15px
    line-height: 1.5
  headings:
    family: Literata
    weight: 500
    line-height: 1.14
  link:
    color: reed-deep
    decoration: underline
