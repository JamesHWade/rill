url: https://jameshwade.github.io/rill/

template:
  bootstrap: 5

reference:
  - title: Run Rill
    desc: Launch the reader or refresh its subscriptions.
    contents:
      - rill_app
      - list_reader_admissions
      - approve_reader_admission
      - poll_feeds
      - prepare_today
      - list_reader_feedback

  - title: Evaluate Reader Feedback
    desc: Review human ratings and calibrate independent judgments with vitals.
    contents:
      - evaluate_reader_feedback
      - reader_feedback_samples

  - title: Subscription interchange
    desc: Move feed subscriptions into and out of Rill with OPML.
    contents:
      - read_opml
      - write_opml
